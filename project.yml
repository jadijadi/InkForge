name: InkForge
options:
  bundleIdPrefix: dev.jadi
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: "1.11.2"
  swift-markdown:
    url: https://github.com/swiftlang/swift-markdown
    from: "0.5.0"
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: "0.9.19"
targets:
  InkForge:
    type: application
    platform: macOS
    sources:
      - path: InkForge
    info:
      path: InkForge/Resources/Info.plist
      properties:
        CFBundleName: InkForge
        CFBundleDisplayName: InkForge
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: ""
        LSApplicationCategoryType: public.app-category.productivity
        NSMainStoryboardFile: ""
    entitlements:
      path: InkForge/Resources/InkForge.entitlements
      properties:
        com.apple.security.app-sandbox: false
    dependencies:
      - package: SwiftTerm
      - package: swift-markdown
        product: Markdown
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.jadi.InkForge
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: minimal
        GENERATE_INFOPLIST_FILE: false
        COMBINE_HIDPI_IMAGES: true
schemes:
  InkForge:
    build:
      targets:
        InkForge: all
    run:
      config: Debug
